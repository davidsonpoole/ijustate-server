{% if name %}
<h1>{{ name }}</h1>
{% else %}
    <form action="{% url 'foods:newFood' %}" method="post">
    <label for="name">Name: </label>
    <input type="text" name="name" id="name" required>
    <br>
    <label for="cal">Calories: </label>
    <input type="number" name="cal" id="cal">
    <br>
    <label for="fat">Fat: </label>
    <input type="text" name="fat" id="fat">
    <br>
    <label for="car">Carbohydrates: </label>
    <input type="text" name="car" id="car">
    <br>
    <label for="pro">Protein: </label>
    <input type="text" name="pro" id="pro">
    <br>
    <label for="serving">Serving: </label>
    <input type="text" name="serving" id="serving">
    <br>
    <input type="submit" value="Done">
    </form>
{% endif %}
